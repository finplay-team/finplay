# 동일 오리진(A안) 리버스 프록시 — blue 색상. deploy/nginx.conf와 구조는 같고
# proxy_pass 대상만 app-blue로 다르다. green과의 유일한 차이는 이 대상 이름과 listen 포트다.
server {
    listen 8081;
    server_name _;

    # --- 프록시 공통 설정 (proxy_pass가 있는 location에만 적용된다) ---
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # ALB가 TLS를 끝내고 이 nginx에는 평문 HTTP로 넘어온다 — $scheme을 그대로 넘기면 백엔드가
    # "http였다"고 잘못 알게 된다. ALB 뒤에서 항상 https이므로 고정한다.
    proxy_set_header X-Forwarded-Proto https;
    # keep-alive 업스트림 연결을 위해 hop-by-hop Connection 헤더를 지운다.
    proxy_set_header Connection "";

    # SSE(/api/stocks/stream)가 실시간으로 흐르려면 아래 3줄이 필요하다.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;

    # --- 백엔드로 넘길 경로 ---
    location /api {
        proxy_pass http://app-blue:8080;
    }

    location /actuator {
        proxy_pass http://app-blue:8080;
    }

    location /v3/api-docs {
        proxy_pass http://app-blue:8080;
    }

    location /swagger-ui {
        proxy_pass http://app-blue:8080;
    }

    # --- 프론트 정적 파일 ---
    # blue·green이 같은 디렉터리를 보면 프론트 갱신 순간 서비스 중인 색에도 즉시 반영돼
    # "신버전 프론트 + 구버전 API" 조합으로 깨진다 — 색상별로 분리한다.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
