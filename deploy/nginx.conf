# 동일 오리진(A안) 리버스 프록시. 프론트 정적 파일과 백엔드 /api를 한 오리진에서 서빙해 CORS를 없앤다 (이슈 #108).
server {
    listen 80;
    server_name _;

    # --- 프록시 공통 설정 (proxy_pass가 있는 location에만 적용된다) ---
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # keep-alive 업스트림 연결을 위해 hop-by-hop Connection 헤더를 지운다.
    proxy_set_header Connection "";

    # SSE(/api/stocks/stream)가 실시간으로 흐르려면 아래 3줄이 필요하다.
    # nginx는 기본적으로 응답을 버퍼링해서, 이게 없으면 매분 push가 클라이언트에 즉시 도달하지 않는다.
    proxy_buffering off;
    proxy_cache off;
    # 백엔드는 spring.mvc.async.request-timeout: -1로 SSE 연결을 무제한 유지하고 20초 heartbeat를 보낸다.
    # heartbeat 간격보다 충분히 큰 값이면 되고, 여기서 끊기면 브라우저가 재연결한다.
    proxy_read_timeout 3600s;

    # --- 백엔드로 넘길 경로 ---
    # 아래 prefix가 아닌 요청은 전부 SPA 폴백으로 index.html이 되므로, 백엔드 경로는 여기에 빠짐없이 적는다.
    location /api {
        proxy_pass http://app:8080;
    }

    # 배포 후 스모크(docs/specs/010-deployment)가 /actuator/health와 /v3/api-docs를 직접 호출한다.
    # 프록시하지 않으면 SPA 폴백이 index.html을 200으로 돌려줘 스모크가 성공한 것처럼 보인다.
    location /actuator {
        proxy_pass http://app:8080;
    }

    location /v3/api-docs {
        proxy_pass http://app:8080;
    }

    location /swagger-ui {
        proxy_pass http://app:8080;
    }

    # --- 프론트 정적 파일 (finplay-frontend의 npm run build 산출물 dist/) ---
    location / {
        root /usr/share/nginx/html;
        # SPA 라우팅 폴백. 없으면 /trade에서 새로고침할 때 nginx가 404를 낸다.
        try_files $uri $uri/ /index.html;
    }
}
