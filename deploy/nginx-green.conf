# 동일 오리진(A안) 리버스 프록시 — green 색상. nginx-blue.conf와 구조는 같고
# proxy_pass 대상(app-green)과 listen 포트(8082)만 다르다. 둘 중 하나를 고치면 반드시 다른 쪽도 확인한다.
server {
    listen 8082;
    server_name _;

    # --- 프록시 공통 설정 (proxy_pass가 있는 location에만 적용된다) ---
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # ALB가 TLS를 끝내고 이 nginx에는 평문 HTTP로 넘어온다 — $scheme을 그대로 넘기면 백엔드가
    # "http였다"고 잘못 알게 된다. ALB 뒤에서 항상 https이므로 고정한다.
    proxy_set_header X-Forwarded-Proto https;
    # keep-alive 업스트림 연결을 위해 hop-by-hop Connection 헤더를 지운다.
    proxy_set_header Connection "";

    # SSE(/api/stocks/stream)가 실시간으로 흐르려면 아래 3줄이 필요하다.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;

    # --- 백엔드로 넘길 경로 ---
    location /api {
        proxy_pass http://app-green:8080;
    }

    location /actuator {
        proxy_pass http://app-green:8080;
    }

    location /v3/api-docs {
        proxy_pass http://app-green:8080;
    }

    location /swagger-ui {
        proxy_pass http://app-green:8080;
    }

    # --- 프론트 정적 파일 ---
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
