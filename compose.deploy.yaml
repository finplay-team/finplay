# 배포용 스택 (EC2 수동 배포 — ADR-0021 이후 정상 경로는 파이프라인이며 이 스택은 폴백이다).
# 프론트는 S3에서 독립 배포되므로 nginx 없이 앱만 띄운다 (ADR-0022 — 이슈 #108 A안·동일 오리진 서빙 폐기).
# 루트 compose.yaml은 로컬 개발 전용(spring-boot-docker-compose가 bootRun에서 자동 기동)이므로 건드리지 않는다.
# 실행: docker compose -f compose.deploy.yaml up -d --build   (같은 디렉터리의 .env를 읽는다)
name: finplay-deploy

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # 시크릿·외부 연동 키는 .env에서 그대로 주입한다 (.env.example 참조). 값은 파일에 적지 않는다.
    # 뉴스·공시 수집과 AI 서술이 쓰는 NAVER_SEARCH_CLIENT_ID·NAVER_SEARCH_CLIENT_SECRET·DART_API_KEY·
    # OPENAI_API_KEY도 이 경로로만 들어온다 (spec 012 FEED-001). 아래 environment 블록에 다시 적지 않는다 —
    # environment가 env_file보다 우선하므로 여기 이름을 적으면 .env 값이 무시된다.
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
    # 런타임 이미지(eclipse-temurin:17-jre)는 Ubuntu 기반이라 curl이 이미 들어 있어 별도 설치 없이 쓴다.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      # 로컬 실측 기동 시간이 약 40초다. 그 사이 실패는 retries로 세지 않는다.
      start_period: 90s
    # 외부 진입점이 ALB로 바뀌면서 호스트 포트를 직접 연다 (ADR-0022 — nginx 제거로 대체).
    ports:
      - "8080:8080"
    restart: unless-stopped
