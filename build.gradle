plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '8.0.0'
	id 'com.github.spotbugs' version '6.5.9'
}

group = 'com.finplay'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.springframework.boot:spring-boot-restclient'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.security:spring-security-crypto'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.0'
	implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-mysql'
	implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
	annotationProcessor 'com.querydsl:querydsl-apt:5.1.0:jakarta'
	annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
	runtimeOnly 'com.mysql:mysql-connector-j'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-mysql'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
	// 전체 컨텍스트를 띄우는 @SpringBootTest용 더미 시크릿 (test 태스크 런타임에만 존재, 프로덕션 fail-fast 유지)
	environment 'EMAIL_VERIFICATION_SECRET', 'test-email-verification-secret'
	environment 'JWT_SECRET', 'test-jwt-secret-that-is-at-least-32-bytes'
	environment 'OAUTH_STATE_SECRET', 'test-oauth-state-secret-that-is-at-least-32-bytes'
	environment 'PASSWORD_RESET_SECRET', 'test-password-reset-secret-that-is-at-least-32-bytes'
	// BithumbFeedSimulator(이슈 #104, !prod 전용)를 @SpringBootTest 전체 컨텍스트에서 비활성화한다.
	// @ConditionalOnProperty는 컨텍스트 refresh 중 빈 정의 스캔 단계(ConfigurationClassPostProcessor)에서
	// 평가되는데, @DynamicPropertySource를 @Import된 설정 클래스에 두면 수집되지 않고(PR #110 리뷰), 대안으로
	// 시도한 DynamicPropertyRegistrar 빈도 그 프로퍼티를 finishBeanFactoryInitialization 단계(빈 정의 스캔보다
	// 늦음, preInstantiateSingletons 이전)에서만 등록해 조건 평가 시점보다 늦다(spring-test-7.0.8 바이트코드로
	// 재확인, 회귀 테스트로 실제 실패 재현함). bithumb.feed.simulate.enabled 자체를 JVM 시스템 프로퍼티로 두면
	// @SpringBootTest뿐 아니라 이 프로퍼티의 matchIfMissing 기본 동작을 검증하는 순수 ApplicationContextRunner
	// 슬라이스 테스트(BithumbFeedSimulatorConditionalTest, 부트 설정 로딩을 거치지 않고 StandardEnvironment의
	// systemProperties를 그대로 봄)까지 오염시켜 "프로퍼티 미설정 시 기본값" 케이스가 거짓으로 깨진다. 대신
	// spring.config.additional-location으로 이 프로퍼티 하나만 담은 별도 파일을 가리킨다 — 이 위치는
	// ConfigDataEnvironmentPostProcessor(SpringApplication 부트스트랩, 즉 @SpringBootTest)만 해석하므로
	// ApplicationContextRunner에는 영향이 없다.
	systemProperty 'spring.config.additional-location', 'classpath:/bithumb-feed-simulator-disabled-for-tests.yml'
	finalizedBy tasks.jacocoTestReport
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
	}
}

// 커버리지 게이트: 라인 커버리지 40% 미만이면 빌드 실패 (진입점 클래스 제외). 초기 경량 시작값 — 지표 보고 상향 예정.
jacocoTestCoverageVerification {
	dependsOn test
	classDirectories.setFrom(
		files(classDirectories.files.collect { fileTree(dir: it, exclude: '**/*Application*') })
	)
	violationRules {
		rule {
			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = 0.40
			}
		}
	}
}

// 정적 버그 탐지 (SpotBugs). 테스트 코드는 분석 대상에서 제외.
spotbugs {
	excludeFilter = file('config/spotbugs/exclude.xml')
}

spotbugsMain {
	reports {
		html {
			required = true
		}
	}
}

spotbugsTest {
	enabled = false
}

check {
	dependsOn jacocoTestCoverageVerification
}

spotless {
	java {
		target 'src/**/*.java'
		// NAVER 자바 스타일 (팀 노션 확정) — 빌드 게이트는 Spotless로 유지하고 스타일만 교체
		eclipse().configFile('config/naver-eclipse-formatter.xml')
		removeUnusedImports()
	}
}
