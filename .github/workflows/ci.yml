# PR마다 전체 빌드·테스트·포맷 검사를 자동으로 실행하는 CI 게이트 (docs/specs/010-deployment)
name: CI

on:
  pull_request:
    branches: [dev, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 문서만 바뀐 PR은 아래 Gradle 스텝을 건너뛴다 — 워크플로우 자체는 항상 실행되어
      # 브랜치 보호 규칙의 required status check로 쓸 수 있게 한다 (paths-ignore로 워크플로우
      # 자체를 안 띄우면 required check 미충족으로 머지가 막힐 수 있다).
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '**/*'
              - '!docs/**'
              - '!**/*.md'

      - uses: actions/setup-java@v4
        if: steps.filter.outputs.code == 'true'
        with:
          distribution: temurin
          java-version: "17"

      # 시크릿 불필요 — @SpringBootTest용 더미 시크릿은 build.gradle의 Test 태스크가 직접 주입한다.
      - name: Gradle build (테스트·포맷검사·커버리지 포함)
        if: steps.filter.outputs.code == 'true'
        run: ./gradlew build
