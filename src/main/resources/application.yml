# 공통 설정. 프로필별 오버라이드는 application-{profile}.yml에. 시크릿 원문은 yml에 적지 않는다 (conventions.md).
spring:
  application:
    name: finplay-api
  jpa:
    hibernate:
      ddl-auto: validate # 스키마 변경은 Flyway로만 (ADR-0004)
    open-in-view: false
  mvc:
    async:
      # SSE(/api/stocks/stream) 연결이 장시간 유지돼야 하므로 컨테이너 async 타임아웃을 두지 않는다.
      # 연결 생존 확인은 SseEmitterRegistry의 20초 heartbeat가 담당한다 (이슈 #18).
      request-timeout: -1
  task:
    scheduling:
      # 기본 pool size 1이면 블로킹 @Scheduled 작업 하나(예: KisHistoricalCandleCollector의 배치 HTTP 호출)가
      # 스레드를 점유하는 동안 나머지 스케줄(heartbeat, price push, replay 세션 확정)이 전부 밀린다.
      # 기본 프로필의 @Scheduled 작업은 5개다 — SseEmitterRegistry heartbeat, StockPriceStreamService,
      # KisHistoricalCandleCollector, StockReplaySessionScheduler, 그리고 BithumbFeedSimulator다.
      # 시뮬레이터는 @Profile("!prod") + matchIfMissing=true라 별도 설정 없이 기본 활성이며, 이전 주석은 이걸
      # 빠뜨리고 4로 세고 있었다 (이슈 #125). 각자 독립 스레드를 쓰도록 5로 맞춘다.
      # crypto-real 프로필은 시뮬레이터가 꺼지고 BithumbRestTickerPoller가 켜져 개수가 그대로 5다.
      # prod는 시뮬레이터가 없어 4개지만 스레드 하나가 더 있는 것은 무해하다.
      # 전용 TaskScheduler 분리는 작업 수가 적어 이번 범위에서는 채택하지 않는다 (PR #90/#94 리뷰, plan.md 참고).
      pool:
        size: 5

# 인증 spec(PRD 태스크 2) 구현 시 사용. 시크릿은 환경변수로만 주입.
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: 3600000 # 1시간
  refresh-token-expiration-ms: 1209600000 # 14일

# 실제 OAuth 공급자 설정. 실제 구현이 활성화되는 prod·oauth-real 프로필에서 환경변수로 주입한다.
oauth:
  state-cookie-secure: ${OAUTH_STATE_COOKIE_SECURE:true}
  state-secret: ${OAUTH_STATE_SECRET}
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET}
    redirect-uri: ${KAKAO_REDIRECT_URI}
  naver:
    client-id: ${NAVER_CLIENT_ID}
    client-secret: ${NAVER_CLIENT_SECRET}
    redirect-uri: ${NAVER_REDIRECT_URI}

# 한국투자증권(KIS) Open API 키 — 과거 분봉 수집 배치(KisHistoricalCandleCollector)가 사용한다(MKT-005).
# 값이 없어도 애플리케이션 기동·./gradlew build는 성공하며, 없으면 수집이 실패해 그날 재생세션이 FAILED가 될 뿐이다.
kis:
  app-key: ${KIS_APP_KEY:}
  app-secret: ${KIS_APP_SECRET:}
  # 조회 API(주식일별분봉조회)·토큰 발급 공통 기본 URL. 모의투자 도메인 사용은 한국투자증권 고객센터에 문의해 문제없다는
  # 답변을 받았다(2026-07-30) — 실전투자 앱키를 발급받기 전까지 로컬·배포 공통으로 이 도메인을 쓴다. 실전투자 앱키로
  # 전환하면 KIS_BASE_URL 값만 바꾸면 된다.
  base-url: ${KIS_BASE_URL:https://openapivts.koreainvestment.com:29443}

# 빗썸 공개 캔들 REST 조회 타임아웃 (MKT-008). 인증·API Key 불필요한 공개 API — 무한 대기로 요청 스레드를 붙잡지 않도록 짧게 잡는다.
bithumb:
  candle:
    connect-timeout-ms: ${BITHUMB_CANDLE_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${BITHUMB_CANDLE_READ_TIMEOUT_MS:3000}
  feed:
    # 빗썸 공개 ticker REST 조회 타임아웃 (이슈 #107). 위 candle과 같은 공개 API·같은 목적이라 형태를 맞춘다.
    # 이 값을 읽는 BithumbRestTickerPoller는 crypto-real 프로필에서만 생성되므로 기본 실행에는 영향이 없다.
    ticker:
      connect-timeout-ms: ${BITHUMB_TICKER_CONNECT_TIMEOUT_MS:2000}
      read-timeout-ms: ${BITHUMB_TICKER_READ_TIMEOUT_MS:3000}
