# 공통 설정. 프로필별 오버라이드는 application-{profile}.yml에. 시크릿 원문은 yml에 적지 않는다 (conventions.md).
spring:
  application:
    name: finplay-api
  jpa:
    hibernate:
      ddl-auto: validate # 스키마 변경은 Flyway로만 (ADR-0004)
    open-in-view: false
  mvc:
    async:
      # SSE(/stocks/stream, /cryptos/stream) 연결이 장시간 유지돼야 하므로 컨테이너 async 타임아웃을 두지 않는다.
      # 연결 생존 확인은 SseEmitterRegistry의 20초 heartbeat가 담당한다 (이슈 #18).
      request-timeout: -1

# 인증 spec(PRD 태스크 2) 구현 시 사용. 시크릿은 환경변수로만 주입.
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: 3600000 # 1시간
  refresh-token-expiration-ms: 1209600000 # 14일

# 실제 OAuth 공급자 설정. 실제 구현이 활성화되는 prod·oauth-real 프로필에서 환경변수로 주입한다.
oauth:
  state-cookie-secure: ${OAUTH_STATE_COOKIE_SECURE:true}
  state-secret: ${OAUTH_STATE_SECRET}
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET}
    redirect-uri: ${KAKAO_REDIRECT_URI}
  naver:
    client-id: ${NAVER_CLIENT_ID}
    client-secret: ${NAVER_CLIENT_SECRET}
    redirect-uri: ${NAVER_REDIRECT_URI}

# 주식 시세 공급자 실행 환경 설정 (MKT-007, spec.md 실행 환경 조합). KIS 키가 없어도 기본값(KRX_REPLAY)으로 기동이 성공해야 한다.
stock-feed:
  provider: ${STOCK_FEED_PROVIDER:KRX_REPLAY}
  service-exposure: ${SERVICE_EXPOSURE:PUBLIC}
  kis-public-display-approved: ${KIS_PUBLIC_DISPLAY_APPROVED:false}
