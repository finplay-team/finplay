# 로컬 개발 설정. datasource는 spring-boot-docker-compose가 compose.yaml에서 자동 구성한다.
# 시크릿은 어떤 값도 yml에 적지 않는다 — JWT_SECRET 등은 .env(gitignore) 또는 IDE 환경변수로 주입 (.env.example 참조).
logging:
  level:
    org.hibernate.SQL: debug

# 로컬 전용 개발 스위치 (불리언 하나 — 시크릿이 아니다). prod 프로필에는 이 키가 없고, 이 키를 읽는 빈
# (LocalForcedOpenStockPriceProvider)도 @Profile("local")이라 존재하지 않는다.
# force-market-open: true면 재생세션이 READY인 동안 장외 시간·주말에도 주식 주문이 통과한다(시장상태를 OPEN으로 덮어씀).
# 기본값 false를 유지하면 "데이터는 READY인데 시장은 CLOSED"라는 정직한 상태를 로컬에서 그대로 확인할 수 있다.
# 켜려면 기동 시 환경변수 FINPLAY_DEV_STOCK_FORCE_MARKET_OPEN=true 를 준다 (docs/api/market.md 시드 절 참고).
finplay:
  dev:
    stock:
      force-market-open: ${FINPLAY_DEV_STOCK_FORCE_MARKET_OPEN:false}

# 모의투자 도메인은 초당 호출 허용량이 낮아 분봉 수집(16종목 x 최대 10페이지)을 연달아 호출하면
# EGW00201(초당 거래건수를 초과하였습니다)로 전 종목이 실패한다(2026-07-30 실측). 요청 사이에 간격을 둬서 피한다.
# 실전투자 도메인으로 전환하면 0으로 낮춰 수집 시간을 줄일 수 있다 (application.yml 기본값이 0이다).
kis:
  request-interval-ms: 600
