# @SpringBootTest 전체 컨텍스트에서 spec 014(랭킹) 재구성 배치 크론을 등록되지 않게 만드는 전용 설정 파일.
#
# 왜 필요한가. @SpringBootTest는 컨텍스트를 통째로 띄우므로 테스트 실행 중 크론이 실제로 등록된다(실측:
# ScheduledTaskHolder에 "0 20 4 * * *"가 CronTask로 올라와 있었다). 이 배치는 앞선 배치들과 성격이 한 단계
# 다르다 — 공유 Testcontainers MySQL에 행을 "더하는" 것이 아니라 공유 Testcontainers Redis의 ranking:{market}
# 키를 임시 키 RENAME으로 **통째로 교체**한다(RankingStore.replaceAll).
#
# 전체 빌드가 04:20 KST에 걸치면 RankingIntegrationTest가 그 순간 깨진다. 그 클래스는 AFTER_COMMIT 검증
# 때문에 @Transactional을 붙일 수 없어 매도 이력이 공유 MySQL에 실제로 남고, 재구성은 그 이력 전부를 ZSET에
# 되살리므로 @BeforeEach가 비워 둔 키에 다른 시나리오의 계좌가 섞여 들어온다 — hasSize(1)이나
# noneMatch(...) 같은 단정이 무너진다. 하루 한 번 그 시각에만 재현되는 실패라 원인 추적이 가장 어렵다.
#
# "-"는 Spring의 Scheduled.CRON_DISABLED다. ScheduledAnnotationBeanPostProcessor가 플레이스홀더를 먼저
# 해석한 뒤 이 값이면 트리거를 아예 등록하지 않는다. 값을 "먼 미래 크론"으로 두는 방법과 달리 트리거가 아예
# 생기지 않으므로 "등록된 크론 트리거가 비어 있다"를 단정할 수 있다.
#
# feedback-schedules-disabled-for-tests.yml에 합치지 않고 파일을 나눈 이유. 그 파일은 헤더가 스스로 밝히듯
# spec 012 전용이고 루트 키도 feedback: 하나다 — 그 아래에 ranking:을 얹으면 파일명과 내용이 갈린다.
# build.gradle이 이 계열 파일을 "끄는 이유"로 나누는 관례를 따르되, 소유 spec이 다르면 파일을 나눈다
# (bithumb-feed-simulator-disabled-for-tests.yml이 이미 그 형태다).
#
# 적재 경로는 나머지 둘과 같다. build.gradle test 태스크의 spring.config.additional-location으로만 로드되며,
# 파일명이 application*.yml이 아니라 application.yml과 "첫 번째로 발견된 파일만 로드" 충돌이 없고, 이 위치는
# ConfigDataEnvironmentPostProcessor(SpringApplication 부트스트랩, 즉 @SpringBootTest)만 해석하므로
# ApplicationContextRunner 기반 슬라이스 테스트에는 영향이 없다.
#
# 끄는 것은 크론뿐이다. 기동 훅(@EventListener(ApplicationReadyEvent))은 그대로 둔다 — 컨텍스트 생성 시점
# (= 테스트 클래스 경계)에만 돌아 테스트 메서드 도중에 끼어들 수 없고, 배선이 실제로 살아 있는지 확인하는
# 값이 있다. 재구성 로직 테스트도 크론이 아니라 메서드를 직접 호출하므로 이 파일과 무관하게 그대로 돈다
# (RankingRebuildServiceTest). 크론 값의 정본은 application.yml이며 이 파일은 그 값을 바꾸는 것이 아니라
# 테스트에서만 무력화한다 — 그래서 운영 값 드리프트 단정은 여기 영향을 받지 않는 yml 전용 형태
# (ConfigDataApplicationContextInitializer)로 둔다. RankingRebuildCronPropertiesTest가 그 자리다.
ranking:
  rebuild:
    cron: "-"
