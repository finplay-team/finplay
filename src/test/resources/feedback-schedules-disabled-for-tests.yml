# @SpringBootTest 전체 컨텍스트에서 spec 012(AI 피드백)의 배치·수집 크론을 등록되지 않게 만드는 전용 설정 파일.
#
# 왜 필요한가. @SpringBootTest는 컨텍스트를 통째로 띄우므로 테스트 실행 중 스케줄이 실제로 등록된다.
# 평일 배치 시각(08:45)이나 30분 간격 수집 시각에 전체 빌드가 걸치면 공유 Testcontainers MySQL(ADR-0003)에
# 아무도 의도하지 않은 데이터가 생기고, 그 시각에만 다른 테스트의 개수·유니크 단정이 흔들린다 — 재현이
# 시계에 묶여 있어 원인 찾기가 가장 어려운 종류다. 매시 05분 코인 배치가 더해지면서 빈도가 한 단계 더 뛰었다.
#
# "-"는 Spring의 Scheduled.CRON_DISABLED다. ScheduledAnnotationBeanPostProcessor가 플레이스홀더를 먼저
# 해석한 뒤 이 값이면 트리거를 아예 등록하지 않는다(spring-context 7.0.8 바이트코드로 확인). 값을 "먼 미래
# 크론"으로 두는 방법과 달리 트리거가 아예 생기지 않으므로 "등록된 크론 트리거가 비어 있다"를 단정할 수 있다.
#
# 크론 값의 정본은 docs/specs/012-ai-feedback/spec.md §C-1이며 이 파일은 그 값을 바꾸는 것이 아니라
# 테스트에서만 무력화한다. 그래서 §C-1 드리프트 단정은 여기 영향을 받지 않는 yml 전용 형태
# (ConfigDataApplicationContextInitializer)로 둔다 — FeedbackBatchPropertiesTest와
# NewsCollectionPropertiesYamlTest가 그 자리다.
#
# 적재 경로는 bithumb-feed-simulator-disabled-for-tests.yml과 같다. build.gradle test 태스크의
# spring.config.additional-location으로만 로드되며, 파일명이 application*.yml이 아니라 application.yml과
# "첫 번째로 발견된 파일만 로드" 충돌이 없고, 이 위치는 ConfigDataEnvironmentPostProcessor(SpringApplication
# 부트스트랩, 즉 @SpringBootTest)만 해석하므로 ApplicationContextRunner 기반 슬라이스 테스트에는 영향이 없다.
#
# 배치 로직 테스트는 크론이 아니라 메서드를 직접 호출하므로 이 파일과 무관하게 그대로 돈다
# (FeedbackBatchIntegrationTest·FeedbackBatchServiceTest·NewsCollectionIntegrationTest).
# 애노테이션 문자열과 @Scheduled 개수를 리플렉션으로 읽는 테스트도 마찬가지다 — "-"는 프로퍼티 값일 뿐
# 애노테이션을 지우지 않는다(FeedbackBatchScheduleTest·NewsCollectionScheduleTest·풀 크기 단정).
feedback:
  batch:
    cron: "-"
    # 코인 배치는 매시 05분이라 주식 배치(평일 08:45)보다 훨씬 자주 걸린다 — 전체 빌드가 한 시간에 한 번은
    # 반드시 그 시각을 지나므로 끄지 않으면 공유 컨테이너에 요약·브리핑 행이 실제로 쌓인다.
    crypto-cron: "-"
    # 장 마감 집단 비교 배치도 평일 15:32에 걸치면 공유 컨테이너에 의도하지 않은 price_move_peer_stats 행이
    # 쌓인다 (이슈 #212). 배치 로직 테스트는 크론이 아니라 메서드를 직접 호출하므로 이 값과 무관하다.
    peer-stats-cron: "-"
    # 코인 집단 비교 배치도 같은 이유로 끈다 (이슈 #275). 매일 00:05라 평일 15:32보다 걸릴 확률이 낮을 뿐
    # 성격은 같다 — 켜 두면 그 시각의 전체 빌드가 공유 컨테이너에 price_move_peer_stats 행을 남긴다.
    crypto-peer-stats-cron: "-"
  news:
    collect-cron: "-"
    disclosure-cron: "-"
