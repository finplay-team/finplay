# 블루-그린 무중단 배포 스택 (ADR-0020). blue(8081)·green(8082) 두 스택을 EC2 한 대에서 동시에
# 띄워 두고, ALB의 두 타깃 그룹이 그 포트를 각각 가리키게 한 뒤 리스너 기본 작업을 전환한다.
# compose.deploy.yaml(단일 스택)과 달리 mysql·redis는 처음부터 없다 — RDS·ElastiCache를 쓴다.
# 실행: docker compose -f compose.bluegreen.yaml up -d --build app-blue nginx-blue
#       (처음엔 blue만 띄운다. green은 다음 배포 때 STEP 2~4에서 띄운다 — 체크리스트 Phase 6 참고)
name: finplay-bluegreen

x-app-common: &app-common
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - .env
  environment:
    SPRING_PROFILES_ACTIVE: prod
    # t4g.small(2GB)에 app 2벌 + nginx 2벌이 함께 뜬다 — JVM 기본값(컨테이너 메모리의 25~50%)에
    # 맡기면 한쪽이 다른 쪽을 밀어낼 수 있어 힙을 명시적으로 눌러 둔다. 첫 전환 때 `docker stats`로
    # 실사용량을 보고 조정한다.
    JAVA_TOOL_OPTIONS: "-Xmx384m -Xss512k"
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
    interval: 10s
    timeout: 5s
    retries: 6
    start_period: 90s
  # 호스트에 포트를 열지 않는다 — 외부 진입점은 각 색의 nginx뿐이다.
  expose:
    - "8080"
  restart: unless-stopped
  # Graceful shutdown(stop_grace_period·server.shutdown: graceful)은 앱 코드 변경이 먼저 필요해
  # 여기서 함께 넣지 않는다 — 별도 PR(체크리스트 Phase 5)에서 두 값을 짝 맞춰 추가한다.

services:
  app-blue:
    <<: *app-common
    container_name: finplay-app-blue

  app-green:
    <<: *app-common
    container_name: finplay-app-green

  nginx-blue:
    image: nginx:1.27-alpine
    container_name: finplay-nginx-blue
    ports:
      - "8081:8081"
    volumes:
      - ./deploy/nginx-blue.conf:/etc/nginx/conf.d/default.conf:ro
      - ${FRONTEND_DIST_BLUE_PATH:-./frontend-dist-blue}:/usr/share/nginx/html:ro
    depends_on:
      app-blue:
        condition: service_healthy
    restart: unless-stopped

  nginx-green:
    image: nginx:1.27-alpine
    container_name: finplay-nginx-green
    ports:
      - "8082:8082"
    volumes:
      - ./deploy/nginx-green.conf:/etc/nginx/conf.d/default.conf:ro
      - ${FRONTEND_DIST_GREEN_PATH:-./frontend-dist-green}:/usr/share/nginx/html:ro
    depends_on:
      app-green:
        condition: service_healthy
    restart: unless-stopped
